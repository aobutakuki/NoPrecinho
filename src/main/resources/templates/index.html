<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/head :: head"></head>
<body>

    <div th:include="fragments/header :: body"></div>
    <div class="all-info">

        <div class="listings-info-card">

            <h1 class="item-count" th:text="'Listings Count: ' + ${listingsCount}">Listings Count</h1>|
            <h1 class="item-count" th:text="'Items Count: ' + ${itemsCount}">Items Count</h1>
        </div>

        <h2>All Items</h2>

        <div class="item-grid">

            <div class="item-card" th:each="item : ${items}">

                <div class="item-info">
                    <img th:src="${item.image_link}" alt="Item Image" />

                    <div class="item-details">
                        <h3 th:text="${item.item_name}">Item Name</h3>
                        <p class="item-id">ID: <span th:text="${item.item_id}">0</span></p>
                        <h6 class="base-name"><span th:text="${item.base_name}">Base Name</span></h6>
                    </div>
                </div>

                <div class="price-list">
                    <h4>Prices:</h4>
                    <ul>
                        <li th:each="listing : ${item.listings}" th:if="${listing.is_availiable}">
                            <span th:text="${listing.supermarket.supermarket_name}">Supermarket</span>:

                            <span class="price"
                                  th:classappend="${listing.item_price == item.getLowestPrice()} ? 'lowest-price' : ''"
                                  th:text="'R$ ' + ${listing.item_price}">R$ 0.00
                            </span>
                        </li>
                    </ul>
                </div>


                <div class="item-actions">
                    <button class="add-button"
                            th:classappend="${addedItemIds.contains(item.item_id)} ? 'added' : ''"
                            th:disabled="${addedItemIds.contains(item.item_id)}"
                            th:onclick="addItemToList(this, [[${item.item_id}]])">

                        <i th:if="${addedItemIds.contains(item.item_id)}" class="fa fa-check" aria-hidden="true"></i>

                        <i th:unless="${addedItemIds.contains(item.item_id)}" class="fa fa-plus-circle" aria-hidden="true"></i>
                    </button>
                </div>

            </div>


    </div>


<script>
    function addItemToList(buttonElement, itemId) {
        // Use fetch to call your API endpoint in the background
        fetch('/items/add?id=' + itemId)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text(); // Parse the Text data from the response
            })
            .then(successMessage => {
                // This code runs AFTER the server has responded and set the cookie
                console.log('Sucess:', successMessage);

                const iconElement = buttonElement.querySelector('i');
                if (iconElement) {
                    iconElement.classList.remove('fa-plus-circle'); // Remove the plus icon class
                    iconElement.classList.add('fa-check');   // Add the checkmark icon class
                }
                buttonElement.classList.add('added');
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
                alert('Failed to add item to list.');
            });
    }
</script>

</body>
</html>
